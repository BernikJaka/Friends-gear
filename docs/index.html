<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends · Gear Needs</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--text:#e7e9ee;--muted:#8b93a7;--accent:#e0b04a;--need:#e5484d;--ok:#3fb950}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:20px 16px 8px;max-width:1200px;margin:auto}
  h1{margin:0;font-size:22px;letter-spacing:.3px}
  h1 span{color:var(--accent)}
  .meta{color:var(--muted);font-size:12px;margin-top:4px}
  nav{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
  .tabs{max-width:1200px;margin:auto;display:flex;gap:6px;padding:8px 16px;overflow-x:auto}
  .tabs button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;white-space:nowrap}
  .tabs button.on{border-color:var(--accent);color:var(--accent)}
  .tabs .n{color:var(--muted);font-size:12px;margin-left:4px}
  main{max-width:1200px;margin:auto;padding:12px 16px 40px}
  .group{margin:18px 0 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0}
  .card.empty{opacity:.45}
  .top{display:flex;align-items:center;gap:8px}
  .top img{width:36px;height:36px;image-rendering:pixelated;background:#0b0d11;border-radius:6px}
  .lbl{font-weight:600}
  .full{color:var(--muted);font-size:11px}
  .cnt{margin-left:auto;background:var(--need);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}
  .names{display:flex;flex-wrap:wrap;gap:4px}
  .names span{background:#222734;border-radius:6px;padding:1px 7px;font-size:12px}
  .names span.off{opacity:.45}
  .names span.off small{display:block;font-size:10px;color:var(--muted)}
  tr.off td{opacity:.45}
  .seen{font-size:11px;color:var(--muted)}
  td .xp{height:3px;background:var(--line);border-radius:2px;margin-top:3px;min-width:70px;overflow:hidden}
  td .xp i{display:block;height:100%;background:var(--accent)}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500;font-size:12px}
  .src{font-size:11px;padding:1px 6px;border-radius:6px;background:#222734;color:var(--muted)}
  .src.game{color:var(--ok)}
  .note{color:var(--muted);font-size:12px;margin-top:14px}
  .toggle{margin-left:auto}
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
  .filters input{flex:1 1 200px;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
  .filters input:focus{outline:none;border-color:var(--accent)}
  .classbtns{display:flex;flex-wrap:wrap;gap:6px}
  .classbtns button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
  .classbtns button.on{border-color:var(--accent);color:var(--accent)}
  .sortbtn{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;white-space:nowrap}
  .sortbtn:hover,.sortbtn.on{color:var(--accent)}
  .count{color:var(--muted);font-size:12px;margin-top:10px}
  .gradebtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .gradebtns button{background:var(--panel);color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
  .gradebtns button.off{color:var(--muted);border-color:var(--line);opacity:.5}
  .dropcontrols{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
  .dropcontrols input{flex:1 1 220px;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
  .dropcontrols button,.wheel button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
  .dropcontrols button.on{border-color:var(--accent);color:var(--accent)}
  .dropcard{width:100%;text-align:left;color:var(--text);font:inherit;background:transparent;border:0;cursor:pointer;padding:0}
  .dropcard:hover .lbl,.dropcard.on .lbl{color:var(--accent)}
  .selected{margin:18px 0;padding:14px;background:var(--panel);border:1px solid var(--accent);border-radius:10px}
  .selected .top img{width:48px;height:48px}
  .wheel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
  .wheel code{flex:1 1 300px;overflow-wrap:anywhere;background:#0b0d11;padding:9px;border-radius:6px}
  .warn{color:var(--accent);font-size:12px}
</style>
</head>
<body>
<header>
  <h1><span id="guild">Friends</span> · Who still needs what</h1>
  <div class="meta" id="meta">Loading…</div>
</header>
<nav><div class="tabs" id="tabs"></div></nav>
<main id="main"></main>
<script>
const ORDER=["Archer","Mage","Knight","Thief"];
let DATA=null, DISCORD_USERS={}, view=localStorageGet("view")||"Archer";
let rosterQuery="", rosterClass=localStorageGet("rosterClass")||"All", rosterSort=localStorageGet("rosterSort")||"class:1";
let dropQuery="", dropClass="All", selectedDrop=null;
let HIDDEN=new Set();   // grades hidden for everyone (docs/settings.json)
let OFF=new Set((()=>{try{return JSON.parse(localStorageGet("offGrades"))||[]}catch(e){return []}})());  // turned off by this visitor
function localStorageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function localStorageSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const isOff=p=>p&&p.onRanking===false;   // dropped off the ranking, kept with last known data: greyed out
const seenTime=p=>p.lastSeen?new Date(p.lastSeen).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}):"unknown";
const seenText=p=>`last seen on ranking: ${seenTime(p)}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const settings=fetch("settings.json?"+Date.now()).then(r=>r.json()).catch(()=>({}));
Promise.all([fetch("data.json?"+Date.now()).then(r=>r.json()),settings,
  fetch("discord-users.json?"+Date.now()).then(r=>r.json()).catch(()=>({}))]).then(([d,s,users])=>{
  HIDDEN=new Set(s.hiddenGrades||[]);DATA=d;DISCORD_USERS=users;render()}).catch(()=>{
  document.getElementById("meta").textContent="Could not load data.json yet - the first update run may not have finished.";
});

function render(){
  document.getElementById("guild").textContent=DATA.guild;
  const t=new Date(DATA.updated);
  document.getElementById("meta").textContent="Updated "+t.toLocaleString()+
    (DATA.rankingsOnline?"":" · rankings were offline, showing last known roster");
  const tabs=[...ORDER.map(c=>[c,c]),["Roster","Roster"],["Dropped items","Dropped items"]];
  document.getElementById("tabs").innerHTML=tabs.map(([k,l])=>{
    const n=k==="Roster"?"":`<span class="n">${DATA.classes[k].players.length}</span>`;
    return `<button class="${k===view?"on":""}" data-k="${k}">${l}${n}</button>`}).join("");
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{view=b.dataset.k;localStorageSet("view",view);render()});
  document.getElementById("main").innerHTML=view==="Roster"?roster():view==="Dropped items"?droppedItems():needs(view);
  if(view==="Roster") wireRoster();
  if(view==="Dropped items") wireDroppedItems();
  document.querySelectorAll(".gradebtns button").forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g;OFF.has(g)?OFF.delete(g):OFF.add(g);
    localStorageSet("offGrades",JSON.stringify([...OFF]));render()});
}

function allDropItems(){
  return ORDER.flatMap(cls=>DATA.classes[cls].items.map(it=>({...it,cls,
    needers:it.needers.filter(name=>{
      const p=DATA.classes[cls].players.find(x=>x.name===name);
      return p&&p.onRanking!==false;
    })
  })));
}
function droppedItems(){
  const classes=["All",...ORDER].map(c=>`<button data-c="${c}" class="${c===dropClass?"on":""}">${c}</button>`).join("");
  const q=dropQuery.trim().toLowerCase();
  const items=allDropItems().filter(it=>(dropClass==="All"||it.cls===dropClass)&&
    (!q||`${it.name} ${it.label} ${it.group} ${it.cls}`.toLowerCase().includes(q)));
  const cards=items.map(it=>`<div class="card ${it.needers.length?"":"empty"}">
    <button class="dropcard ${selectedDrop===it.cls+":"+it.col?"on":""}" data-drop="${esc(it.cls+":"+it.col)}">
      <div class="top"><img src="${esc(it.icon)}" alt="" loading="lazy"><div><div class="lbl">${esc(it.name)}</div>
      <div class="full">${esc(it.cls)} · G${it.grade} · ${esc(it.label)}</div></div>${it.needers.length?`<span class="cnt">${it.needers.length}</span>`:""}</div>
    </button></div>`).join("");
  const selected=selectedDrop&&allDropItems().find(it=>it.cls+":"+it.col===selectedDrop);
  let detail="";
  if(selected){
    const handles=Object.fromEntries(Object.entries(DISCORD_USERS).map(([n,v])=>[n.toLowerCase(),v]));
    const eligible=selected.needers;
    const command="/wheel list"+(eligible.length?" "+eligible.map(n=>handles[n.toLowerCase()]||n).join(" "):"");
    const unmapped=eligible.filter(n=>!handles[n.toLowerCase()]);
    detail=`<section class="selected"><div class="top"><img src="${esc(selected.icon)}" alt=""><div><div class="lbl">${esc(selected.name)}</div><div class="full">${esc(selected.cls)} · G${selected.grade}</div></div></div>
      <div class="group">${eligible.length} ranked member${eligible.length===1?"":"s"} still need this item</div>
      <div class="names">${eligible.length?eligible.map(n=>`<span>${esc(n)}${handles[n.toLowerCase()]?` <small>${esc(handles[n.toLowerCase()])}</small>`:""}</span>`).join(""):`<span>No ranked members currently need this item.</span>`}</div>
      ${unmapped.length?`<p class="warn">Discord name missing for: ${unmapped.map(esc).join(", ")}. Those names are used as plain text until added to docs/discord-users.json.</p>`:""}
      <div class="wheel"><code id="wheel-command">${esc(command)}</code><button id="copy-wheel" ${eligible.length?"":"disabled"}>Copy /wheel list</button><span id="copy-status" class="full" aria-live="polite"></span></div></section>`;
  }
  return `<div class="dropcontrols"><input id="drop-q" type="search" placeholder="Search items…" value="${esc(dropQuery)}"><div class="classbtns">${classes}</div></div>
    <div class="count">${items.length} items · select an item to see who needs it</div>${detail}<div class="grid">${cards||"<p class='note'>No items match.</p>"}</div>
    <p class="note">Only members currently on the level ranking are included, because their gear is refreshed from the game. Add Discord names in docs/discord-users.json to replace plain in-game names in the command.</p>`;
}
function wireDroppedItems(){
  const q=document.getElementById("drop-q");q.oninput=e=>{dropQuery=e.target.value;const pos=q.selectionStart;render();const next=document.getElementById("drop-q");next.focus();next.setSelectionRange(pos,pos)};
  document.querySelectorAll(".dropcontrols button").forEach(b=>b.onclick=()=>{dropClass=b.dataset.c;render()});
  document.querySelectorAll(".dropcard").forEach(b=>b.onclick=()=>{selectedDrop=b.dataset.drop;render()});
  const copy=document.getElementById("copy-wheel");
  if(copy)copy.onclick=async()=>{
    const command=document.getElementById("wheel-command").textContent;
    try{await navigator.clipboard.writeText(command)}catch(e){
      const box=document.createElement("textarea");box.value=command;document.body.appendChild(box);box.select();
      try{document.execCommand("copy")}catch(_){}box.remove();
    }
    document.getElementById("copy-status").textContent="Copied";
  };
}

function needs(cls){
  const items=DATA.classes[cls].items.filter(it=>!HIDDEN.has(it.grade));
  const grades=[...new Set(items.map(it=>it.grade))].sort((a,b)=>a-b);
  const byName=Object.fromEntries(DATA.classes[cls].players.map(p=>[p.name,p]));
  let html=`<div class="gradebtns">${grades.map(g=>`<button class="${OFF.has(g)?"off":""}" data-g="${g}">G${g}</button>`).join("")}</div>`,group=null;
  for(const it of items.filter(it=>!OFF.has(it.grade))){
    if(it.group!==group){ if(group!==null) html+="</div>"; group=it.group; html+=`<div class="group">${esc(group)}</div><div class="grid">`; }
    const n=it.needers.length;
    html+=`<div class="card ${n?"":"empty"}">
      <div class="top" title="${esc(it.name)}"><img src="${esc(it.icon)}" alt="${esc(it.name)}" loading="lazy">
        <div class="lbl">${esc(it.label)}</div>
        ${n?`<span class="cnt">${n}</span>`:""}</div>
      <div class="names">${it.needers.map(x=>{const p=byName[x];return isOff(p)
        ?`<span class="off">${esc(x)}<small>${esc(seenText(p))}</small></span>`:`<span>${esc(x)}</span>`}).join("")}</div></div>`;
  }
  return html+(group!==null?"</div>":"")+"<p class='note'>A player is only listed for grades higher than what they already have in that slot.</p>";
}

function roster(){
  const btns=["All",...ORDER].map(c=>`<button class="${c===rosterClass?"on":""}" data-c="${c}">${c}</button>`).join("");
  return `<div class="filters"><input id="q" type="search" placeholder="Search name…" value="${esc(rosterQuery)}">
    <div class="classbtns">${btns}</div></div>
    <div class="count" id="count"></div>
    <table><thead id="head"></thead>
    <tbody id="rows"></tbody></table>`;
}

function rosterRows(){
  const q=rosterQuery.trim().toLowerCase();
  const list=[];
  for(const c of ORDER){
    if(rosterClass!=="All"&&c!==rosterClass) continue;
    const grade=Object.fromEntries(DATA.classes[c].items.map(it=>[it.col,it.grade]));
    for(const p of DATA.classes[c].players)
      if(!q||p.name.toLowerCase().includes(q)) list.push({p,c,missing:p.needs.filter(col=>!HIDDEN.has(grade[col])).length});
  }
  const [key,d]=sortState(), dir=+d;
  const prog=x=>x.p.progress??-1;
  const byLevel=(a,b)=>(a.p.level==null)-(b.p.level==null)||(b.p.level??0)-(a.p.level??0)||prog(b)-prog(a);   // unknown level always last
  const cmp={class:(a,b)=>ORDER.indexOf(a.c)-ORDER.indexOf(b.c),
             specialty:(a,b)=>(!a.p.specialty)-(!b.p.specialty)||String(a.p.specialty||"").localeCompare(String(b.p.specialty||"")),
             level:(a,b)=>(a.p.level==null)-(b.p.level==null)||(a.p.level??0)-(b.p.level??0)||prog(a)-prog(b),
             missing:(a,b)=>a.missing-b.missing}[key];
  const empty={specialty:a=>!a.p.specialty,level:a=>a.p.level==null}[key];
  list.sort((a,b)=>isOff(a.p)-isOff(b.p)||(empty?empty(a)-empty(b):0)||dir*cmp(a,b)||byLevel(a,b)||a.p.name.localeCompare(b.p.name));
  const rows=list.map(({p,c,missing})=>`<tr class="${isOff(p)?"off":""}"><td>${esc(p.name)}${isOff(p)?`<div class="seen">${esc(seenText(p))}</div>`:""}</td><td>${c}</td><td>${esc(p.specialty||"")}</td><td>${lvCell(p)}</td>
        <td>${missing}</td><td><span class="src ${p.source}">${p.source==="game"?"from game":"waiting for game data"}</span></td></tr>`).join("");
  return {html:rows||`<tr><td colspan="6" class="note">No players match.</td></tr>`,shown:list.length};
}

const SORTS=[["class","Class",1],["specialty","Specialty",1],["level","Lv",-1],["missing","Missing items",-1]];   // [key,label,first-click direction]
function sortState(){
  const [k,d]=rosterSort.split(":");
  return SORTS.some(s=>s[0]===k)&&(d==="1"||d==="-1")?[k,d]:["class","1"];
}

// "Lv 64 · 37.2%" with a thin EXP bar under it
function lvCell(p){
  if(p.level==null) return "";
  if(p.progress==null) return `Lv ${p.level}`;
  const pct=Math.max(0,Math.min(100,+p.progress));
  return `Lv ${p.level} · ${pct.toFixed(2)}%<div class="xp" title="EXP ${pct.toFixed(2)}% of level ${p.level}"><i style="width:${pct}%"></i></div>`;
}

function refreshRoster(){
  const [key,dir]=sortState();
  const th=([k,l])=>`<th><button class="sortbtn ${k===key?"on":""}" data-s="${k}">${l}${k===key?(dir==="1"?" ▲":" ▼"):""}</button></th>`;
  document.getElementById("head").innerHTML=`<tr><th>Player</th>${SORTS.map(th).join("")}<th>Gear data</th></tr>`;
  document.querySelectorAll(".sortbtn").forEach(b=>b.onclick=()=>{
    const k=b.dataset.s, first=SORTS.find(s=>s[0]===k)[2];
    rosterSort=k+":"+(k===key?-dir:first);localStorageSet("rosterSort",rosterSort);refreshRoster()});
  const total=ORDER.reduce((n,c)=>n+DATA.classes[c].players.length,0);
  const {html,shown}=rosterRows();
  document.getElementById("rows").innerHTML=html;
  const off=ORDER.reduce((n,c)=>n+DATA.classes[c].players.filter(isOff).length,0);
  document.getElementById("count").textContent=(shown===total?`${total} members`:`Showing ${shown} of ${total} members`)+(off?` · ${off} not on the ranking`:"");
}

function wireRoster(){
  document.getElementById("q").oninput=e=>{rosterQuery=e.target.value;refreshRoster()};
  document.querySelectorAll(".classbtns button").forEach(b=>b.onclick=()=>{
    rosterClass=b.dataset.c;localStorageSet("rosterClass",rosterClass);
    document.querySelectorAll(".classbtns button").forEach(x=>x.classList.toggle("on",x===b));
    refreshRoster();
  });
  refreshRoster();
}
</script>
</body>
</html>
