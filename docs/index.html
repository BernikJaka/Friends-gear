<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Data unavailable</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#191c22;--line:#2a2f39;--text:#e8eaf0;--muted:#9ba3b3;--accent:#e3b64f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,480px);padding:32px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:center;box-shadow:0 16px 48px #0004}
    .mark{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 18px;border:1px solid #705d37;border-radius:50%;color:var(--accent);font-size:24px}
    h1{margin:0 0 8px;font-size:22px;font-weight:650}
    p{margin:0;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">!</div>
    <h1>No data received</h1>
    <p>The site is temporarily unavailable. Please try again later.</p>
  </main>
</body>
</html>
