name: Update gear site

on:
  schedule:
       - cron: "*/5 * * * *"    # every 5 minutes
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]          # website changes publish right away

permissions:
  contents: read
  pages: write
  id-token: write

# one run at a time; a new run waits for the current deploy instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json
        run: python update.py     # reads the live site's data.json as the previous state
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
