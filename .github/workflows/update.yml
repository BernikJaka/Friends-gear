name: Update gear site

on:
  schedule:
  - cron: "*/5 * * * *"    # every 5 minutes
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json
        run: python update.py
      - name: Commit if something changed
        run: |
          git config user.name  "gear-bot"
          git config user.email "gear-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Update gear data" && git push)
